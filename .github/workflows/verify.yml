name: Verify Finite-Bar Discrete GR Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Module 1 (Exterior GR, Tests 1-3)
        run: python tests/module_1_exterior_gr.py

      - name: Run Module 2 (Core Stresses & Curvature Bound, Tests 4-5)
        run: python tests/module_2_core_regularization.py

      - name: Run Module 3 (Stencil Isotropy & Dispersion, Tests 6-8)
        run: python tests/module_3_stencil_isotropy.py

      - name: Run Module 4 (Horizon, Saturation & Inner-Horizon Blueshift, Tests 9-13)
        run: python tests/module_4_horizon_and_freezing.py

      - name: Run Module 5 (Discrete Flux Identity & Rotating Flow, Tests 14-15)
        run: python tests/module_5_nonspherical_and_spin.py

      - name: Run Module 6 (Linear Quantum Evolution & Hayward Thermodynamics, Tests 16-17)
        run: python tests/module_6_quantum_and_thermodynamics.py

      - name: Run Module 7 (Geodesics, Junctions, Ringdown & Echoes, Tests 18-21)
        run: python tests/module_7_strong_field_and_observables.py

      - name: Run Module 8 (Extensions & Stress Tests, Tests 22-25)
        run: python tests/module_8_theory_extensions_and_stress_limits.py

      - name: Run Module 9 (Dynamical Collapse on a Falling Lattice, Tests 26-29)
        run: python tests/module_9_dynamical_collapse.py

      - name: Run Module 10 (Post-Bounce Shock, Causality Audit & Core Horizon, Tests 30-33)
        run: python tests/module_10_post_bounce_shock.py

      - name: Run Module 11 (Relativistic Misner-Sharp / Einstein-Euler Fluid Bounce, Tests 34-37)
        run: python tests/module_11_relativistic_einstein_euler.py

      - name: Run Module 12 (Random Voronoi vs. Smooth Anamorphic Grids & Tidal Bar Stress, Tests 38-42)
        run: python tests/module_12_random_grid_and_voronoi_audit.py

      - name: Run Module 13 (Emergent General Relativity & 3D Spin-2 Gravitational Waves, Tests 43-47)
        run: python tests/module_13_emergent_anamorphic_gr.py

      - name: Run Master Verification Suite (10 Benchmarks + 13 Modules / 47 Tests + Claims Audit)
        run: python verify_core_finite_bar_gr.py

      - name: Run 3D Lattice Simulator (energy budget)
        run: python simulate_3d_18pt_freezing_core.py
